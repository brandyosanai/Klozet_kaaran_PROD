<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | KLOZET KAARAN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;800;900&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <style>
    .product-main-img { width: 100%; height: auto; background: var(--color-surface); object-fit: cover; border: 1px solid rgba(255,255,255,0.05); }

    /* Main gallery — images are stacked and crossfade between each
       other (opacity + a slight scale), rather than the page/track
       physically scrolling. Triggered by the arrow, a dot, or a
       swipe — never by scroll position — so there's no "paging"
       feel, just one clean transition at a time. */
    .product-gallery { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); background: var(--color-surface); aspect-ratio: 3 / 4; touch-action: pan-y; }
    .product-gallery-slide {
      position: absolute; inset: 0;
      opacity: 0;
      transform: translateZ(0) scale(1.015);
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .product-gallery-slide.active {
      opacity: 1;
      transform: translateZ(0) scale(1);
      pointer-events: auto;
    }
    .product-gallery-slide img {
      width: 100%; height: 100%; display: block; object-fit: cover;
      backface-visibility: hidden;
    }
    @media (prefers-reduced-motion: reduce) {
      .product-gallery-slide { transition: opacity 0.2s linear; transform: none !important; }
    }

    /* Left-side dot indicators, layered over the image. */
    .gallery-dots {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 9px; z-index: 5;
    }
    .gallery-dot {
      width: 7px; height: 7px; border-radius: 50%; padding: 0;
      border: 1.5px solid rgba(255,255,255,0.55); background: transparent;
      cursor: pointer; transition: all 0.25s ease;
    }
    .gallery-dot:hover { border-color: #fff; }
    .gallery-dot.active { background: #fff; border-color: #fff; }
    .gallery-dot:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }

    /* Bottom-right floating "next image" control — minimal glass pill. */
    .gallery-nav-arrow {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,20,0.4);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      opacity: 0.85; transform: translateZ(0) scale(1);
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
    }
    .gallery-nav-arrow .material-symbols-outlined { font-size: 20px; }
    .gallery-nav-arrow:hover { opacity: 1; transform: scale(1.08); background: rgba(245,130,32,0.85); }
    .gallery-nav-arrow:active { transform: scale(0.94); }
    .gallery-nav-arrow:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
    .gallery-nav-arrow[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .gallery-nav-arrow { transition: opacity 0.25s ease; }
      .gallery-nav-arrow:hover, .gallery-nav-arrow:active { transform: none; }
    }

    /* Thumbnail filmstrip — horizontally scrollable with smooth,
       native momentum scroll; the active thumb scrolls into view
       automatically when you use the arrows. */
    .thumb-strip {
      display: flex; gap: 8px; overflow-x: auto; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .thumb-strip::-webkit-scrollbar { height: 5px; }
    .thumb-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .thumb-img { flex: 0 0 64px; width: 64px; height: 80px; object-fit: cover; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; border: 1px solid rgba(255,255,255,0.05); }
    .thumb-img.active, .thumb-img:hover { opacity: 1; border-color: var(--color-primary); }
    .size-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-weight: 600; padding: 0.5rem 1.25rem; transition: all 0.2s; }
    .size-btn.active, .size-btn:hover { background: #fff; color: #000; border-color: #fff; }
  </style>
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="cursorDot" aria-hidden="true" style="position:fixed;width:8px;height:8px;background:#f58220;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform 0.15s ease,opacity 0.15s ease;"></div>

  <main id="productDetailMain" class="container py-5" style="margin-top: 32px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a id="backToCategoryBtn" href="services.html" class="text-decoration-none text-white d-inline-flex align-items-center gap-2 opacity-75 opacity-100-hover" style="color: #fff !important; transition: opacity 0.2s;">
        <span class="material-symbols-outlined" style="font-size: 20px; color: #fff;">arrow_back</span> 
        <span id="backToCategoryText">BACK TO COLLECTIONS</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <button id="kkWishlistBtn" style="background:none;border:none;color:#fff;cursor:pointer;position:relative;" aria-label="Saved items">
          <span class="material-symbols-outlined" style="font-size:24px;">bookmark_border</span>
          <span class="kk-badge" id="kkWishlistBadge">0</span>
        </button>
        <button id="kkCartBtn" style="background:none;border:none;color:#fff;cursor:pointer;position:relative;" aria-label="Cart">
          <span class="material-symbols-outlined" style="font-size:24px;">shopping_cart</span>
          <span class="kk-badge" id="kkCartBadge">0</span>
        </button>
      </div>
    </div>

    <div class="row g-5">
      <div class="col-md-6">
        <div class="product-gallery mb-3" id="productGallery">
          <div id="productGalleryTrack"></div>
          <div class="gallery-dots" id="galleryDots"></div>
          <button class="gallery-nav-arrow" id="galleryNextBtn" aria-label="View next product image" hidden>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
          </button>
        </div>
        <div class="thumb-strip" id="thumbnailRow"></div>
      </div>

      <div class="col-md-6 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-start">
              <span id="productCategory" style="background-color: #f58220; color: #000; font-weight: 800; font-size: 0.7rem; padding: 4px 10px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block;">DROP COLLECTION</span>              <button id="productBookmarkBtn" class="kk-bookmark" style="position:static;" aria-label="Save for later">
              <span class="material-symbols-outlined">bookmark_border</span>
            </button>
          </div>
          <h1 class="display-5 font-headline fw-black text-uppercase mt-1 mb-2" id="productTitle">LOADING...</h1>
          <h2 class="h3 text-primary fw-bold mb-4" id="productPrice">₹0</h2>

          <p class="text-secondary mb-4" style="line-height: 1.7;" id="productDesc">Loading details...</p>

          <div class="mb-4">
            <p class="fw-bold tracking-widest small mb-2">SELECT SIZE</p>
            <div class="d-flex gap-2" id="sizeContainer"></div>
          </div>

          <div class="mb-4">
            <p class="fw-bold tracking-widest small mb-2">SELECT COLOR — <span id="selectedColorName"></span></p>
            <div class="d-flex gap-2" id="colorContainer"></div>
          </div>

          <div class="mb-5">
            <p class="fw-bold tracking-widest small mb-2">QUANTITY</p>
            <div class="kk-qty-stepper">
              <button class="kk-qty-btn" id="pdQtyMinus" aria-label="Decrease quantity">−</button>
              <span id="pdQtyValue">1</span>
              <button class="kk-qty-btn" id="pdQtyPlus" aria-label="Increase quantity">+</button>
            </div>
          </div>
        </div>

        <div>
          <button id="addToCartBtn" class="btn btn-kk-primary w-100 py-3 text-center d-flex align-items-center justify-content-center gap-2 fw-bold text-uppercase tracking-widest" style="background: var(--color-primary); color:#000; border:none;">
            ADD TO CART <span class="material-symbols-outlined">shopping_cart</span>
          </button>
        </div>
      </div>
    </div>

    <div id="suggestedSection" class="mt-5 pt-4" style="border-top: 1px solid rgba(255,255,255,0.08); display:none;">
      <h3 class="font-headline fw-black text-uppercase mb-3" style="font-size: 1.3rem;">You Might Also Like</h3>
      <div class="row g-3" id="suggestedItems"></div>
    </div>
  </main>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/stock-sync.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Parse which product to show from the URL, e.g. product-detail.html?product=urban-zen
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('product') || 'heavyweight-tee';

    let selectedSize = null;
    let selectedColor = null;
    let rendered = false; // guards against building the page twice

    function showNotFound() {
      document.getElementById('productTitle').innerText = 'PRODUCT NOT FOUND';
      document.getElementById('productDesc').innerText = 'This item may have been removed. Head back to Collections to keep browsing.';
      const addBtn = document.getElementById('addToCartBtn');
      if (addBtn) { addBtn.disabled = true; addBtn.style.opacity = '0.4'; addBtn.style.pointerEvents = 'none'; }
    }

    // ─── Image gallery state ───
    // Images crossfade in place (opacity/scale transition on whichever
    // slide is .active) instead of the container physically scrolling —
    // that's the "smooth transition, not a scrolling page" behaviour.
    // Navigation comes from three inputs only: the arrow, a dot, or a
    // swipe — index changes never happen from a scroll position.
    let galleryImages = [];
    let galleryIndex = 0;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateGalleryUI() {
      document.querySelectorAll('.product-gallery-slide').forEach((slide, i) => {
        slide.classList.toggle('active', i === galleryIndex);
      });
      document.querySelectorAll('.gallery-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === galleryIndex);
      });
      document.querySelectorAll('.thumb-img').forEach((img, i) => {
        img.classList.toggle('active', i === galleryIndex);
      });
      const activeThumb = document.querySelector('.thumb-img.active');
      if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function goToImage(index) {
      if (!galleryImages.length) return;
      galleryIndex = (index + galleryImages.length) % galleryImages.length; // loops both directions
      updateGalleryUI();
    }

    // Thumbnail click handler (called from inline onclick on generated thumbs)
    function changeImage(index) {
      goToImage(index);
    }

    document.getElementById('galleryNextBtn').addEventListener('click', () => {
      goToImage(galleryIndex + 1); // wraps to the first image after the last
    });

    // Mobile swipe — left/right only. We only read the start/end touch
    // point (no preventDefault, no touchmove work), so vertical page
    // scrolling is completely unaffected and every listener stays passive.
    (function setupSwipe() {
      const gallery = document.getElementById('productGallery');
      let startX = 0, startY = 0;
      gallery.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      gallery.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          goToImage(galleryIndex + (dx < 0 ? 1 : -1)); // swipe left -> next, right -> previous
        }
      }, { passive: true });
    })();

    // The single build of this page. Runs exactly once, only once the
    // live catalog (assets/js/stock-sync.js) has resolved — so this
    // always reads the same up-to-date product data every other page
    // uses, never the bundled fallback. That's what fixes images/price/
    // name/description showing stale values here after an admin edit.
    function renderProduct() {
      if (rendered) return;
      rendered = true;

      const product = (window.KK_PRODUCTS || {})[productId];
      if (!product || product.active === false) {
        showNotFound();
        return;
      }

      document.getElementById('productTitle').innerText = product.title;
      document.getElementById('productPrice').innerText = '₹' + product.price.toLocaleString('en-IN');
      document.getElementById('productCategory').innerText = product.category;
      document.getElementById('productDesc').innerText = product.desc;

      // Main image gallery + thumbnail filmstrip — supports any number
      // of images (3–10 typical); today's data has 1, so the arrow and
      // dots stay hidden until more are uploaded. First image loads
      // eager (it's above the fold), the rest stay lazy.
      const images = (product.images && product.images.length) ? product.images : [];
      galleryImages = images;
      galleryIndex = 0;

      const track = document.getElementById('productGalleryTrack');
      track.innerHTML = images.map((imgSrc, index) =>
        '<div class="product-gallery-slide' + (index === 0 ? ' active' : '') + '">' +
          '<img src="' + imgSrc + '" alt="' + product.title + '" ' +
            'loading="' + (index === 0 ? 'eager' : 'lazy') + '" decoding="async" />' +
        '</div>'
      ).join('');

      const dotsRow = document.getElementById('galleryDots');
      dotsRow.innerHTML = images.length > 1 ? images.map((_, index) =>
        '<button class="gallery-dot' + (index === 0 ? ' active' : '') + '" aria-label="View image ' + (index + 1) + '" onclick="changeImage(' + index + ')"></button>'
      ).join('') : '';

      const thumbRow = document.getElementById('thumbnailRow');
      thumbRow.innerHTML = images.map((imgSrc, index) =>
        '<img src="' + imgSrc + '" class="thumb-img' + (index === 0 ? ' active' : '') + '" onclick="changeImage(' + index + ')" />'
      ).join('');

      document.getElementById('galleryNextBtn').hidden = images.length <= 1;

      // Size buttons — built from this product's own size list
      const sizeContainer = document.getElementById('sizeContainer');
      sizeContainer.innerHTML = '';
      selectedSize = product.sizes[0];
      product.sizes.forEach((size, i) => {
        const btn = document.createElement('button');
        btn.className = 'size-btn' + (i === 0 ? ' active' : '');
        btn.textContent = size;
        btn.addEventListener('click', () => {
          sizeContainer.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSize = size;
        });
        sizeContainer.appendChild(btn);
      });

      // Color swatches — built from this product's own color list.
      // Colors here don't carry their own images (this product model
      // has one gallery per product, not per-variant), so switching
      // color never touches the image gallery above.
      const colorContainer = document.getElementById('colorContainer');
      colorContainer.innerHTML = '';
      selectedColor = product.colors[0].name;
      document.getElementById('selectedColorName').textContent = selectedColor;
      product.colors.forEach((color, i) => {
        const btn = document.createElement('button');
        btn.className = 'kk-color-swatch' + (i === 0 ? ' active' : '');
        btn.style.background = color.hex;
        btn.title = color.name;
        btn.addEventListener('click', () => {
          colorContainer.querySelectorAll('.kk-color-swatch').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColor = color.name;
          document.getElementById('selectedColorName').textContent = selectedColor;
        });
        colorContainer.appendChild(btn);
      });

      // Quantity stepper
      let qty = 1;
      document.getElementById('pdQtyMinus').addEventListener('click', () => {
        qty = Math.max(1, qty - 1);
        document.getElementById('pdQtyValue').textContent = qty;
      });
      document.getElementById('pdQtyPlus').addEventListener('click', () => {
        qty += 1;
        document.getElementById('pdQtyValue').textContent = qty;
      });

      // Sold out handling
      const addBtn = document.getElementById('addToCartBtn');
      const outOfStock = typeof product.stock === 'number' && product.stock <= 0;
      addBtn.disabled = outOfStock;
      addBtn.style.opacity = outOfStock ? '0.4' : '';
      addBtn.style.pointerEvents = outOfStock ? 'none' : '';
      if (outOfStock) addBtn.innerText = 'SOLD OUT';

      // Add to Cart — hands off to the shared cart engine (assets/js/cart.js),
      // which opens the cart drawer and builds the WhatsApp message from
      // the same window.KK_PRODUCTS entry at checkout time.
      addBtn.addEventListener('click', () => {
        window.KKCartAPI.addToCart(productId, selectedSize, selectedColor, qty);
      });

      // Bookmark toggle for this specific product page
      const bookmarkBtn = document.getElementById('productBookmarkBtn');
      function refreshBookmarkIcon() {
        const saved = window.KKCartAPI.isSaved(productId);
        bookmarkBtn.classList.toggle('active', saved);
        bookmarkBtn.querySelector('.material-symbols-outlined').textContent = saved ? 'bookmark' : 'bookmark_border';
      }
      bookmarkBtn.addEventListener('click', () => {
        window.KKCartAPI.toggleSaved(productId);
        refreshBookmarkIcon();
      });
      refreshBookmarkIcon();

      renderSuggested(product);
    }

    // "You Might Also Like" — up to 4 other active products from the
    // same category, same card look as the Collections grid. Falls
    // back to other active products if this category doesn't have
    // enough on its own, so the row is never left empty/half-full.
    function renderSuggested(currentProduct) {
      const section = document.getElementById('suggestedSection');
      const row = document.getElementById('suggestedItems');
      const all = window.KK_PRODUCTS || {};

      const candidates = Object.keys(all)
        .filter((id) => id !== productId && all[id].active !== false)
        .map((id) => Object.assign({ id: id }, all[id]));

      const sameCategory = candidates.filter((p) => p.category === currentProduct.category);
      const others = candidates.filter((p) => p.category !== currentProduct.category);
      const picks = sameCategory.concat(others).slice(0, 4);

      if (picks.length === 0) return;

      row.innerHTML = picks.map(function (p) {
        const img = (p.images && p.images[0]) || '';
        const name = (p.title || '').toUpperCase();
        return (
          '<div class="col-6 col-md-3">' +
            '<div class="product-card" style="min-width:0;">' +
              '<div class="kk-card-media" style="position:relative;">' +
                '<a href="product-detail.html?product=' + encodeURIComponent(p.id) + '" class="text-decoration-none">' +
                  '<div class="product-card-image orange-glow-hover">' +
                    '<img src="' + img + '" alt="' + name + '" loading="lazy" />' +
                  '</div>' +
                '</a>' +
                '<button class="kk-bookmark" data-product-id="' + p.id + '" aria-label="Save for later"><span class="material-symbols-outlined">bookmark_border</span></button>' +
              '</div>' +
              '<div class="mt-2">' +
                '<a href="product-detail.html?product=' + encodeURIComponent(p.id) + '" class="text-decoration-none">' +
                  '<p class="product-card-name" style="font-size:0.9rem; color:#fff; margin-bottom:0;">' + name + '</p>' +
                '</a>' +
                '<span class="product-card-price" style="font-size:1rem;">' + '₹' + Number(p.price).toLocaleString('en-IN') + '</span>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      section.style.display = '';
    }

    // stock-sync.js fires this once, after the live catalog (or the
    // bundled fallback, if the API is unreachable) is in window.KK_PRODUCTS.
    // We wait for it rather than building twice, so this page never shows
    // a stale image/price for a moment and then "jumps" to the real one.
    document.addEventListener('kk:productsReady', renderProduct);
  </script>

  <script src="assets/js/gsap.js"></script>
</body>
</html>
